name: TTS deneme
on:
  push:
    branches: [tts-deneme]
    paths: ["tts_deneme/**", ".github/workflows/tts-deneme.yml"]
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts
      - run: mkdir -p cikti && python tts_deneme/uret.py 2>&1 | tee cikti/log.txt; ls -la cikti
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seslendirme
          path: cikti/
      - name: Çıktıyı dala kaydet
        if: always()
        run: |
          mkdir -p tts_deneme/cikti && cp cikti/* tts_deneme/cikti/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tts_deneme/cikti && git commit -m "TTS çıktısı [skip ci]" && git pull --rebase && git push || true
